    trigger_facts: [prefer_stable_coherence, sample_scene_count, landcover]
  - key: azimuth_looks
    trigger_facts: [prefer_stable_coherence, sample_scene_count, landcover]
  - key: filter_strength
    trigger_facts: [landcover, climate, sample_scene_count]
