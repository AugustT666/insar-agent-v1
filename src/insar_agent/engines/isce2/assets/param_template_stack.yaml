template_name: sentinel-isce2-stack
description: >
  Sentinel-1 TOPS stack/time-series parameter template. Default multilook 10:2
  for S1 IW — a starting point the user or the param-advisor can adjust per scene.
shared_defaults:
  swaths: [1, 2, 3]
  polarization: vv
  bbox: null
  esd_coherence_threshold: 0.85
  filter_strength: 0.5
workflow_defaults:
  workflow: interferogram
  num_connections: 3
  coregistration: NESD
  range_looks: 10
  azimuth_looks: 2
  do_unwrap: true
  unwrap_method: snaphu
  num_proc: 1
  use_gpu: false
single_pair_only: []
stack_only:
  - slc_dir
  - workflow
  - num_connections
  - coregistration
  - num_proc
  - use_gpu
sources:
  - title: ISCE2 stackSentinel.py
    url: https://github.com/isce-framework/isce2/blob/a492b8d/contrib/stack/topsStack/stackSentinel.py
  - title: ISCE2 topsStack README
    url: https://github.com/isce-framework/isce2/blob/a492b8d/contrib/stack/topsStack/README.md
notes:
  - Multilook 10:2 is the default starting point, not a fixed rule; tune per scene.
  - Network formation and coregistration mode are stack-only decisions.
