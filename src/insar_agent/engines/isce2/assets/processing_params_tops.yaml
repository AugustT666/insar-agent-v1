# ISCE2 topsApp processing parameter registry
# Used by insar_set_processing_param to validate and apply parameter changes.
# Path fields (required before run) and algorithm params are both listed here.

parameters:

  # ── Required path fields ────────────────────────────────────────────────────

  - key: reference_safe
    label: Reference S1 SAFE/ZIP path
    type: str
    required: true
    risk_level: low
    description: >
      Absolute path to the reference Sentinel-1 SAFE directory or ZIP archive.

  - key: secondary_safe
    label: Secondary S1 SAFE/ZIP path
    type: str
    required: true
    risk_level: low
    description: >
      Absolute path to the secondary Sentinel-1 SAFE directory or ZIP archive.

  - key: orbit_dir
    label: Orbit files directory
    type: str
    required: true
    risk_level: low
    description: >
      Directory containing Sentinel-1 POEORB or RESORB orbit files.
      ISCE2 will search this directory for the appropriate orbit file.

  - key: dem_file
    label: DEM file path
    type: str
    required: true
    risk_level: low
    description: >
      Absolute path to DEM file (GeoTIFF). Use insar_download_dem to obtain
      Copernicus 30m DEM.

  # ── Optional path fields ────────────────────────────────────────────────────

  - key: aux_dir
    label: Auxiliary calibration files directory
    type: str
    required: false
    risk_level: low
    description: >
      Directory containing Sentinel-1 auxiliary calibration files (AUX_CAL).
      Leave empty to skip auxiliary calibration correction.

  # ── Scene selection ─────────────────────────────────────────────────────────

  - key: swaths
    label: IW subswaths to process
    type: list
    required: false
    risk_level: low
    valid_values: [[1], [2], [3], [1, 2], [1, 3], [2, 3], [1, 2, 3]]
    description: >
      List of IW subswath numbers to process. Default [1, 2, 3] processes all
      three subswaths. Use a subset to speed up processing or focus on coverage.

  - key: polarization
    label: Polarization channel
    type: str
    required: false
    risk_level: low
    valid_values: [vv, vh, hh, hv]
    description: >
      Polarization to process. VV is standard for most InSAR applications over
      land. VH may have lower coherence over vegetated areas.

  - key: bbox
    label: Bounding box [S, N, W, E]
    type: list
    required: false
    risk_level: low
    description: >
      Geographic bounding box as [south_lat, north_lat, west_lon, east_lon].
      Limits processing to this region. If omitted, full swath is processed.

  # ── Coregistration ──────────────────────────────────────────────────────────

  - key: do_esd
    label: Enhanced spectral diversity coregistration
    type: bool
    required: false
    risk_level: medium
    description: >
      Enable Enhanced Spectral Diversity (ESD) for precise burst overlap
      coregistration. Recommended for deformation studies. May cause issues
      in low-coherence scenes.

  - key: esd_coherence_threshold
    label: ESD coherence threshold
    type: float
    required: false
    risk_level: medium
    valid_range: [0.1, 0.99]
    description: >
      Minimum coherence threshold for ESD estimation. Pixels below this
      threshold are excluded. Default 0.7 is appropriate for most scenes.

  # ── Filtering ───────────────────────────────────────────────────────────────

  - key: filter_strength
    label: Interferogram filter strength (Goldstein)
    type: float
    required: false
    risk_level: medium
    valid_range: [0.0, 1.0]
    description: >
      Goldstein filter exponent (0 = no filtering, 1 = maximum filtering).
      Higher values suppress noise but may smooth real deformation signals.
      0.5 is a good default for most scenes.

  # ── Multilook ───────────────────────────────────────────────────────────────

  - key: range_looks
    label: Range looks
    type: int
    required: false
    risk_level: medium
    valid_range: [1, 20]
    description: >
      Number of range looks for multilooking. More looks reduce noise but
      decrease resolution. Default 20 produces ~80m pixel spacing for S1 IW.

  - key: azimuth_looks
    label: Azimuth looks
    type: int
    required: false
    risk_level: medium
    valid_range: [1, 20]
    description: >
      Number of azimuth looks for multilooking. Default 4 produces ~80m pixel
      spacing for S1 IW (combined with range_looks=20).

  # ── Unwrapping ──────────────────────────────────────────────────────────────

  - key: do_unwrap
    label: Perform phase unwrapping
    type: bool
    required: false
    risk_level: low
    description: >
      Whether to perform phase unwrapping. Set to false to skip unwrapping
      and output only the wrapped interferogram.

  - key: unwrap_method
    label: Phase unwrapping algorithm
    type: str
    required: false
    risk_level: medium
    valid_values: [snaphu, icu]
    description: >
      Unwrapping algorithm. SNAPHU is the standard choice for most applications.
      ICU (branch cut) may be faster but less robust.

  - key: do_unwrap_2stage
    label: Two-stage unwrapping
    type: bool
    required: false
    risk_level: medium
    description: >
      Enable two-stage phase unwrapping to better handle large deformation
      gradients. Slower but more robust for earthquake/volcanic scenes.
