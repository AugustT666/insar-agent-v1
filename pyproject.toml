[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "insar-agent"
version = "0.1.0"
description = "Independent MCP-oriented scaffold for InSAR agent tooling"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "August" }
]
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=1.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "h5py>=3.8",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
insar-agent = "insar_agent.cli:main"
insar-mcp-server = "insar_agent.mcp.server:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not real_data' --import-mode=importlib"
markers = [
  "real_data: tests that require mounted NAS data or launch real processing workflows",
  "timeout: maximum runtime hint for long-running integration tests",
]

[tool.ruff]
# Archived knowledge-base scripts are preserved as external reference material.
# Some files are not UTF-8 and are not part of the package lint surface.
extend-exclude = ["docs/archive/knowledge-base/"]

[tool.ruff.lint.per-file-ignores]
# The mcp package is split into focused modules that share one FastMCP instance
# and a common foundation (imports/constants) re-exported from ``_app``/``_helpers``
# via ``from ... import *``.  server.py additionally re-exports every moved tool so
# ``from insar_agent.mcp.server import <name>`` (and the background here-doc runner)
# keeps resolving.  The star-import / intentional-re-export lint family is scoped to
# these files only; the rest of the codebase keeps the default ruleset.
"src/insar_agent/mcp/_helpers.py" = ["F403", "F405"]
"src/insar_agent/mcp/resources.py" = ["F403", "F405"]
"src/insar_agent/mcp/prompts.py" = ["F403", "F405"]
"src/insar_agent/mcp/server.py" = ["F401", "F403", "F405"]
"src/insar_agent/mcp/tools/*.py" = ["F403", "F405"]
