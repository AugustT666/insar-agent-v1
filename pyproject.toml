[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "insar-agent"
version = "0.1.0"
description = "Independent MCP-oriented scaffold for InSAR agent tooling"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "August" }
]
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
insar-agent = "insar_agent.cli:main"
insar-mcp-server = "insar_agent.mcp.server:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
