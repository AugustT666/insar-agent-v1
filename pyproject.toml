[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "insar-agent"
version = "0.1.0"
description = "Independent MCP-oriented scaffold for InSAR agent tooling"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "August" }
]
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=1.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "h5py>=3.8",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
insar-agent = "insar_agent.cli:main"
insar-mcp-server = "insar_agent.mcp.server:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not real_data'"
markers = [
  "real_data: tests that require mounted NAS data or launch real processing workflows",
  "timeout: maximum runtime hint for long-running integration tests",
]
